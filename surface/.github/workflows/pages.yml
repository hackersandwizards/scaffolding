# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it. It publishes the catalog build (dist/)
# to GitHub Pages on every push to main through scaffolding's reusable workflow.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@v{{version}}
    permissions:
      contents: read
      pages: write
      id-token: write
